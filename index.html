<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>삼국지 스택 게임즈 (Samgukji Stack Games)</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        width: 100%;
        min-height: 100%;
        background: #0e1116;
        color: #f8fafc;
        font-family: 'Malgun Gothic', 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .hub {
        width: min(920px, 92vw);
        padding: 40px 24px;
        text-align: center;
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border: 1px solid rgba(251, 191, 36, 0.45);
        border-radius: 999px;
        color: #fbbf24;
        font-size: 13px;
        letter-spacing: 0.08em;
        margin-bottom: 14px;
        background: rgba(251, 191, 36, 0.08);
      }
      h1 {
        font-size: clamp(28px, 4vw, 42px);
        font-weight: 800;
        color: #fde047;
        text-shadow: 0 3px 16px rgba(251, 191, 36, 0.25);
        margin-bottom: 10px;
      }
      .subtitle {
        color: #94a3b8;
        font-size: 15px;
        margin-bottom: 36px;
      }
      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
        gap: 20px;
      }
      .card {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        text-align: left;
        padding: 26px;
        border-radius: 14px;
        background: linear-gradient(160deg, #1b1713 0%, #12151c 100%);
        border: 1px solid rgba(251, 191, 36, 0.25);
        text-decoration: none;
        color: inherit;
        transition: transform 0.18s ease, border-color 0.18s ease, box-shadow 0.18s ease;
      }
      .card:hover {
        transform: translateY(-4px);
        border-color: #fbbf24;
        box-shadow: 0 12px 30px rgba(0, 0, 0, 0.45);
      }
      .card-tag {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #38bdf8;
        margin-bottom: 8px;
      }
      .card-tag.brawl {
        color: #f97316;
      }
      .card h2 {
        font-size: 24px;
        font-weight: 800;
        color: #f8fafc;
        margin-bottom: 10px;
      }
      .card p {
        font-size: 14px;
        line-height: 1.6;
        color: #cbd5e1;
        margin-bottom: 22px;
      }
      .cta {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 14px;
        font-weight: 700;
        color: #fde047;
      }
    </style>
  </head>
  <body>
    <main class="hub">
      <div class="badge">SAMGUKJI ARCADE</div>
      <h1>삼국지 스택 게임즈</h1>
      <p class="subtitle">플레이할 모드를 선택하세요</p>

      <section class="cards">
        <a class="card" href="./castle-defense/">
          <div>
            <div class="card-tag">Castle Defense</div>
            <h2>성지키기 (Castle Defense)</h2>
            <p>
              몰려오는 산적과 보스로부터 촉의 성채와 바리케이드를 수호하는 웨이브 디펜스 액션.
            </p>
          </div>
          <span class="cta">게임 시작 →</span>
        </a>

        <a class="card" href="./brawl/">
          <div>
            <div class="card-tag brawl">Three Kingdoms Mayhem</div>
            <h2>삼국지 난장판 (Brawl)</h2>
            <p>
              고정 카메라 2.5D 장안 시장 아레나에서 펼치는 16비트 아케이드 스타일 난투 액션.
            </p>
          </div>
          <span class="cta">게임 시작 →</span>
        </a>
      </section>
    </main>
  </body>
</html>
